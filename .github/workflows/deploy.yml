name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Install Rush
        run: npm install -g @microsoft/rush

      - name: Rush update (installs deps via pnpm)
        run: rush update

      - name: Build dependency sub-projects
        run: rush build --to-except bemuse

      - name: Build Bemuse app
        working-directory: bemuse
        run: npx rushx build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./bemuse/dist
